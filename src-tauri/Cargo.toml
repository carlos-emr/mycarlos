[package]
name = "mycarlos-tauri-poc"
version = "0.1.0"
description = "A non-production Tauri evaluation for the proposed myCarlos app"
authors = ["CARLOS EMR contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "mycarlos_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
atomicwrites = "0.4"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
# CMS and X.509 parsing for the "Verified" check of signed PDFs (#55). This
# format stack stays pinned on DER 0.7; see DEPENDENCY_REVIEW.md.
cms = "=0.2.3"
der = { version = "=0.7.10", features = ["alloc", "oid"] }
# P-256 verification uses the current RustCrypto EC generation to avoid
# RUSTSEC-2026-0387 through crypto-bigint; keep these versions aligned.
ecdsa = { version = "=0.17.0", features = ["der"] }
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
# Opens a password-protected PDF, only ever in the separate helper process (src/pdf_unlock.rs).
# Pinned: it parses untrusted input, so an update is a reviewed change.
lopdf = { version = "=0.45.0", default-features = false }
# Draws a page of a PDF, only ever in the separate helper process (src/pdf_view.rs). Pinned for
# the same reason. hayro-syntax and the decoders below it use unsafe code (DEPENDENCY_REVIEW);
# "simd" is off, which leaves out pic-scale's SIMD paths only.
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
# Writes the page picture as PNG; the parent decodes bounded RGBA8 output and encodes its pixels
# again before display (already in the tree through hayro).
image = { version = "0.25", default-features = false, features = ["png"] }
p256 = { version = "=0.14.0", features = ["ecdsa", "pkcs8"] }
percent-encoding = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
unicode-normalization = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = "=0.2.5"
zeroize = { version = "1", features = ["derive"] }
zxcvbn = { version = "3.1.1", default-features = false }

# Match the WebKitGTK bindings already used by the pinned Tauri/Wry runtime. The PDF helper's
# sandbox on Linux (#63): Landlock where the kernel has it, and a seccomp filter it cannot run
# without. Pinned: each update is a reviewed change (DEPENDENCY_REVIEW).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_8"] }
landlock = "=0.4.7"
seccompiler = "=0.5.0"

# Match the WebView2 bindings already used by the pinned Tauri/Wry runtime.
[target.'cfg(windows)'.dependencies]
# Reviewed Windows transport delta and upstream provenance: vendor/README.md.
tauri-plugin-single-instance = "=2.4.0"
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# CI publishes debug bundles as the evaluation downloads. Unoptimized, the
# memory-hard KDF alone takes several seconds on every unlock, so keep it and
# the passphrase estimator optimized in debug builds and tests as well.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.zxcvbn]
opt-level = 3

# Reviewed local deltas and upstream provenance: vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib" }
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
