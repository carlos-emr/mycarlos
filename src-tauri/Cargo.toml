[package]
name = "mycarlos-tauri-poc"
version = "0.1.0"
description = "A non-production Tauri evaluation for the proposed myCarlos app"
authors = ["CARLOS EMR contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "mycarlos_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Portal linking, document pickup, arrival notices and automatic checks are always
# built. Notices and automatic checks stay off until the patient turns them on.
default = []
# Test builds only: the model helper's stub mode, which answers canned FAKE text after a delay
# (src/model_helper.rs), so CI tests the launcher, sandbox, cancel and lock without a model. No
# installer enables it; CI fails a build of the app that accepts the stub argument.
ai-helper-stub = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
atomicwrites = "0.4"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
# CMS and X.509 parsing for the "Verified" check of signed PDFs (#55). This
# format stack stays pinned on DER 0.7; see DEPENDENCY_REVIEW.md.
cms = "=0.2.3"
der = { version = "=0.7.10", features = ["alloc", "oid"] }
# P-256 verification uses the current RustCrypto EC generation to avoid
# RUSTSEC-2026-0387 through crypto-bigint; keep these versions aligned.
ecdsa = { version = "=0.17.0", features = ["der"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hkdf = "0.12"
fluent-bundle = "=0.16.0"
# Only the frozen X25519 suite. Disable default P256 KEM to keep the current
# independent P256 verifier stack and avoid old EC dependencies.
hpke = { version = "=0.13.0", default-features = false, features = ["std", "x25519"] }
hmac = "0.12"
libc = "0.2"
# Opens a password-protected PDF, only ever in the separate helper process (src/pdf_unlock.rs).
# Pinned: it parses untrusted input, so an update is a reviewed change.
lopdf = { version = "=0.45.0", default-features = false }
# Draws a page of a PDF, only ever in the separate helper process (src/pdf_view.rs). Pinned for
# the same reason. hayro-syntax and the decoders below it use unsafe code (DEPENDENCY_REVIEW);
# "simd" is off, which leaves out pic-scale's SIMD paths only.
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
# Writes the page picture as PNG; the parent decodes bounded RGBA8 output and encodes its pixels
# again before display (already in the tree through hayro).
image = { version = "0.25", default-features = false, features = ["png"] }
p256 = { version = "=0.14.0", features = ["ecdsa", "pkcs8"] }
percent-encoding = "2"
rand = "0.8"
# The portal client (src/portal_client.rs). Android does not use it yet: the platform
# verifier there needs its Kotlin component, so linking fails closed on Android.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["time", "macros"] }
unicode-normalization = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = "=0.2.5"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["alloc", "static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = { version = "3.1.1", default-features = false }

# Match the WebKitGTK bindings already used by the pinned Tauri/Wry runtime. The PDF helper's
# sandbox on Linux (#63): Landlock where the kernel has it, and a seccomp filter it cannot run
# without. Pinned: each update is a reviewed change (DEPENDENCY_REVIEW).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_8"] }
landlock = "=0.4.7"
seccompiler = "=0.5.0"

# Match the WebView2 bindings already used by the pinned Tauri/Wry runtime. Data_Xml_Dom,
# UI_Notifications and Win32_System_WinRT show document arrival notices.
# Win32_System_Diagnostics_Debug and Win32_System_Kernel turn crash reports off in the AI
# helper's model process (src/model_helper/confine.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }

# Exact existing locked runtime packages; narrow AppKit features give native
# confirmations explicit keyboard roles with localized titles.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSNotification"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSView", "NSWindow"] }

# The AI helper's model runtime (#72): llama.cpp, built from the source these crates vendor and
# run only in the model helper process (src/model_helper.rs). Windows and Linux only: no helper
# runs on phones, and macOS waits for #211 (llama.cpp needs macOS 10.15; the app supports 10.13).
# Pinned, both: llama.cpp parses the model file, so an update is a reviewed change. No default
# features: ggml's own threads instead of OpenMP. On x86_64, .cargo/config.toml builds ggml for
# AVX2, FMA, F16C and BMI2; the helper checks the processor has them before it loads anything.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false }
llama-cpp-sys-2 = "=0.1.160"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# CI publishes debug bundles as the evaluation downloads. Unoptimized, the
# memory-hard KDF alone takes several seconds on every unlock, so keep it and
# the passphrase estimator optimized in debug builds and tests as well.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.zxcvbn]
opt-level = 3

# The AI model's file (2-4 GB) is hashed again before every start of its helper (#72): unoptimized,
# SHA-256 runs at about 17 MB/s here (146 s for a 2.5 GB model), optimized at about 600 MB/s (4 s).
# The evaluation installers are debug builds.
[profile.dev.package.sha2]
opt-level = 3

# The model runtime (#72) optimized in debug builds too. llama-cpp-sys-2 builds llama.cpp as CMake
# "Release" when its build script runs without debug info, and as "RelWithDebInfo" otherwise
# (-O2 -g; on MSVC /O2 /Ob1, which inlines less).
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
debug = false

[profile.dev.package.llama-cpp-2]
opt-level = 3

# Every other dependency is optimized in debug builds too, since the evaluation installers are
# debug builds: the PDF reader's rasterizer (hayro), its PNG encoding and decoding and lopdf
# otherwise run unoptimized on every page and zoom. The overrides above still apply (a named
# package wins over "*"); debug assertions and overflow checks are unchanged (opt-level alone sets
# neither).
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: a shorter cold build and smaller artifacts (as measured).
debug = false

# myCarlos's own crate at opt-level 1 in debug builds. Every page view decrypts the whole document,
# and the AEAD (XChaCha20-Poly1305) is generic code, which Rust compiles in the crate that uses it:
# here, so the dependencies' opt-level does not reach it. Unoptimized, an 11 MiB document took
# about 2.1 s per page view, at opt-level 1 about 90 ms (vault read_for_view, median of 3). Debug
# info, debug assertions and overflow checks stay on; a debugger may show some locals as optimized
# out.
[profile.dev.package.mycarlos-tauri-poc]
opt-level = 1

# Reviewed local deltas and upstream provenance: vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib" }

[[test]]
name = "model_helper"
path = "tests/model_helper.rs"
required-features = ["ai-helper-stub"]

[[test]]
name = "native_dialog_macos"
path = "tests/native_dialog_macos.rs"
harness = false

# Only the platform event harness needs event construction and run-loop dates.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDate", "NSRunLoop"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSGraphics", "NSGraphicsContext", "NSRunningApplication", "NSActionCell", "NSButtonCell", "NSCell"] }
